name: TakedownIQ
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  TakedownIQ:
    type: application
    platform: iOS
    sources:
      - path: TakedownIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.TakedownIQ
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Takedown IQ
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Takedown IQ uses the camera to film your matches so the AI coach can break down your technique."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Takedown IQ needs photo library access so you can pick match videos you already filmed."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Takedown IQ reads your weight data (read-only) to keep your weight cut inside the safe curve."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Takedown IQ would save weigh-in entries to Health so your weight-cut history stays in one place."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
    entitlements:
      path: TakedownIQ/TakedownIQ.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.TakedownIQ
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
